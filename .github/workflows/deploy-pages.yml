name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEFAULT_GAS_URL: https://script.google.com/macros/s/AKfycbxbf6qTTfRd-CIBrtDWwN0b4I-wGcjQGHWe-EIsP5yoX3UYHAgnNTL193810FKuRHI/exec

jobs:
  build:
    runs-on: ubuntu-latest
    # 掛上 github-pages 環境，讓建置階段同時讀得到 Repository Secrets/Vars 與 github-pages Environment Secrets/Vars
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          GOOGLE_APP_SCRIPT_URL: ${{ secrets.GOOGLE_APP_SCRIPT_URL || vars.GOOGLE_APP_SCRIPT_URL || secrets.GOOGLE_APPS_SCRIPT_URL || vars.GOOGLE_APPS_SCRIPT_URL || env.DEFAULT_GAS_URL }}
          PASS_THRESHOLD: ${{ vars.PASS_THRESHOLD || secrets.PASS_THRESHOLD || '5' }}
          QUESTION_COUNT: ${{ vars.QUESTION_COUNT || secrets.QUESTION_COUNT || '8' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
